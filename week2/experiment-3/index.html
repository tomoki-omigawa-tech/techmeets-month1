<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDoリスト</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      min-height: 100vh;
    }

    .container {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      padding: 32px;
      width: 100%;
      max-width: 480px;
      height: fit-content;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 24px;
      text-align: center;
    }

    .input-area {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
    }

    .input-area > input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-area > input[type="text"]:focus {
      border-color: #6366f1;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .priority-select {
      padding: 10px 10px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      background: #fff;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
      flex-shrink: 0;
    }

    .priority-select:focus {
      border-color: #6366f1;
    }

    .date-input {
      flex: 1;
      padding: 10px 10px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
      color: #374151;
      outline: none;
      transition: border-color 0.2s;
    }

    .date-input:focus {
      border-color: #6366f1;
    }

    .input-row button {
      padding: 10px 18px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .input-row button:hover {
      background: #4f46e5;
    }

    #task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: #f9fafb;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      transition: opacity 0.2s;
    }

    .task-text {
      flex: 1;
      font-size: 15px;
      color: #374151;
      cursor: pointer;
      user-select: none;
      word-break: break-all;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .task-item.high {
      background: #fff5f5;
      border-color: #fca5a5;
    }

    .task-item.due-today {
      background: #fefce8;
      border-color: #fbbf24;
    }

    .task-item.overdue {
      background: #fee2e2;
      border-color: #dc2626;
    }

    .deadline-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      flex-shrink: 0;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    .deadline-badge.normal {
      background: #f3f4f6;
      color: #6b7280;
    }

    .deadline-badge.due-today {
      background: #fef3c7;
      color: #d97706;
    }

    .deadline-badge.overdue {
      background: #fee2e2;
      color: #dc2626;
    }

    .priority-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      flex-shrink: 0;
      letter-spacing: 0.03em;
    }

    .priority-badge.high {
      background: #fee2e2;
      color: #dc2626;
    }

    .priority-badge.normal {
      display: none;
    }

    .delete-btn {
      padding: 4px 10px;
      background: transparent;
      color: #ef4444;
      border: 1.5px solid #ef4444;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      background: #ef4444;
      color: #fff;
    }

    .empty-msg {
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
      padding: 16px 0;
    }

    .counter {
      text-align: center;
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 16px;
    }

    .counter span {
      font-weight: 600;
      color: #6366f1;
    }

    .section-heading {
      font-size: 14px;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 28px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1.5px solid #e5e7eb;
    }

    #done-section {
      display: none;
    }

    #done-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #done-list .task-item {
      opacity: 0.6;
    }

    .filter-area {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .filter-bar {
      display: flex;
      gap: 6px;
    }

    .filter-btn {
      flex: 1;
      padding: 6px 0;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      font-size: 13px;
      font-weight: 600;
      color: #6b7280;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .filter-btn:hover {
      border-color: #6366f1;
      color: #6366f1;
    }

    .filter-btn.active {
      background: #6366f1;
      border-color: #6366f1;
      color: #fff;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: #6366f1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ToDoリスト</h1>
    <p class="counter" id="counter">完了 <span id="done-count">0</span> / <span id="total-count">0</span> 件</p>
    <div class="input-area">
      <input type="text" id="task-input" placeholder="タスクを入力..." />
      <div class="input-row">
        <select id="priority-select" class="priority-select">
          <option value="normal">普通</option>
          <option value="high">重要</option>
        </select>
        <input type="date" id="due-date" class="date-input" />
        <button onclick="addTask()">追加</button>
      </div>
    </div>
    <div class="filter-area">
      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">すべて</button>
        <button class="filter-btn" data-filter="pending" onclick="setFilter('pending')">未完了のみ</button>
        <button class="filter-btn" data-filter="done" onclick="setFilter('done')">完了済みのみ</button>
      </div>
      <input type="text" id="search-input" class="search-input" placeholder="タスク名で検索..." oninput="render()" />
    </div>
    <ul id="task-list"></ul>

    <div id="done-section">
      <h2 class="section-heading">完了済み</h2>
      <ul id="done-list"></ul>
    </div>
  </div>

  <script>
    const tasks = JSON.parse(localStorage.getItem('todo-tasks') || '[]');
    let currentFilter = 'all';

    function saveTasks() {
      localStorage.setItem('todo-tasks', JSON.stringify(tasks));
    }

    function getKeyword() {
      return document.getElementById('search-input').value.trim().toLowerCase();
    }

    function matchesKeyword(task) {
      const kw = getKeyword();
      return !kw || task.text.toLowerCase().includes(kw);
    }

    function getTodayStr() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function getDeadlineStatus(dueDate) {
      if (!dueDate) return null;
      const today = getTodayStr();
      if (dueDate < today) return 'overdue';
      if (dueDate === today) return 'due-today';
      return 'normal';
    }

    function createTaskItem(task, index) {
      const deadlineStatus = (!task.done && task.dueDate) ? getDeadlineStatus(task.dueDate) : null;

      let className = 'task-item';
      if (task.done) className += ' done';
      if (task.priority === 'high') className += ' high';
      if (deadlineStatus === 'due-today') className += ' due-today';
      if (deadlineStatus === 'overdue') className += ' overdue';

      const li = document.createElement('li');
      li.className = className;

      const badge = document.createElement('span');
      badge.className = 'priority-badge ' + task.priority;
      badge.textContent = '重要';

      const span = document.createElement('span');
      span.className = 'task-text';
      span.textContent = task.text;
      span.onclick = () => toggleTask(index);

      const btn = document.createElement('button');
      btn.className = 'delete-btn';
      btn.textContent = '削除';
      btn.onclick = () => deleteTask(index);

      li.appendChild(badge);
      li.appendChild(span);

      if (task.dueDate) {
        const [y, m, d] = task.dueDate.split('-');
        const badgeClass = task.done ? 'normal' : (deadlineStatus || 'normal');
        const label = (!task.done && deadlineStatus === 'overdue')
          ? `期限切れ ${m}/${d}`
          : `期限 ${m}/${d}`;
        const deadlineBadge = document.createElement('span');
        deadlineBadge.className = 'deadline-badge ' + badgeClass;
        deadlineBadge.textContent = label;
        li.appendChild(deadlineBadge);
      }

      li.appendChild(btn);
      return li;
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
      render();
    }

    function render() {
      const pendingList = document.getElementById('task-list');
      const doneList = document.getElementById('done-list');
      const doneSection = document.getElementById('done-section');

      pendingList.textContent = '';
      doneList.textContent = '';

      const doneTasks = tasks.filter(t => t.done);
      document.getElementById('done-count').textContent = doneTasks.length;
      document.getElementById('total-count').textContent = tasks.length;

      const showPending = currentFilter !== 'done';
      const showDone = currentFilter !== 'pending';

      pendingList.style.display = showPending ? '' : 'none';

      if (showPending) {
        const filteredPending = tasks.filter(t => !t.done && matchesKeyword(t));
        if (filteredPending.length === 0) {
          const msg = document.createElement('p');
          msg.className = 'empty-msg';
          msg.textContent = tasks.filter(t => !t.done).length === 0 ? 'タスクがありません' : '該当するタスクがありません';
          pendingList.appendChild(msg);
        } else {
          filteredPending.forEach(task => {
            pendingList.appendChild(createTaskItem(task, tasks.indexOf(task)));
          });
        }
      }

      if (!showDone) {
        doneSection.style.display = 'none';
      } else {
        const filteredDone = tasks.filter(t => t.done && matchesKeyword(t));
        if (currentFilter === 'done') {
          doneSection.style.display = 'block';
          if (filteredDone.length === 0) {
            const msg = document.createElement('p');
            msg.className = 'empty-msg';
            msg.textContent = doneTasks.length === 0 ? '完了済みのタスクがありません' : '該当するタスクがありません';
            doneList.appendChild(msg);
          } else {
            filteredDone.forEach(task => {
              doneList.appendChild(createTaskItem(task, tasks.indexOf(task)));
            });
          }
        } else {
          if (filteredDone.length === 0) {
            doneSection.style.display = 'none';
          } else {
            doneSection.style.display = 'block';
            filteredDone.forEach(task => {
              doneList.appendChild(createTaskItem(task, tasks.indexOf(task)));
            });
          }
        }
      }
    }

    function addTask() {
      const input = document.getElementById('task-input');
      const text = input.value.trim();
      if (!text) return;

      const priority = document.getElementById('priority-select').value;
      const dueDate = document.getElementById('due-date').value;
      tasks.push({ text, done: false, priority, dueDate });
      input.value = '';
      document.getElementById('due-date').value = '';
      input.focus();
      saveTasks();
      render();
    }

    function toggleTask(index) {
      tasks[index].done = !tasks[index].done;
      saveTasks();
      render();
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      saveTasks();
      render();
    }

    document.getElementById('task-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTask();
    });

    render();
  </script>
</body>
</html>
