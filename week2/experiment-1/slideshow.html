<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スライドショー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #f1f5f9;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 24px;
      color: #94a3b8;
      letter-spacing: 0.05em;
    }

    .slideshow {
      position: relative;
      width: 600px;
      background: #0f172a;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    }

    .slides {
      position: relative;
      width: 100%;
      height: 300px;
    }

    .slide {
      display: none;
      width: 100%;
      height: 100%;
    }

    .slide.active {
      display: block;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .caption {
      padding: 16px 24px;
      font-size: 0.95rem;
      color: #cbd5e1;
      background: #0f172a;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      text-align: center;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: #0f172a;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f1f5f9;
      font-size: 1rem;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn:disabled {
      opacity: 0.25;
      cursor: default;
    }

    .counter {
      font-size: 0.9rem;
      color: #64748b;
    }

    .dots {
      display: flex;
      gap: 8px;
      justify-content: center;
      padding: 12px 0;
      background: #0f172a;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .dot.active {
      background: #60a5fa;
      transform: scale(1.3);
    }
  </style>
</head>
<body>

  <h1>スライドショー</h1>

  <div class="slideshow">
    <div class="slides">
      <div class="slide active">
        <img src="https://placehold.jp/3d4070/ffffff/600x300.png?text=Slide+1" alt="スライド 1">
      </div>
      <div class="slide">
        <img src="https://placehold.jp/2a5f3e/ffffff/600x300.png?text=Slide+2" alt="スライド 2">
      </div>
      <div class="slide">
        <img src="https://placehold.jp/7c3060/ffffff/600x300.png?text=Slide+3" alt="スライド 3">
      </div>
      <div class="slide">
        <img src="https://placehold.jp/705020/ffffff/600x300.png?text=Slide+4" alt="スライド 4">
      </div>
      <div class="slide">
        <img src="https://placehold.jp/205070/ffffff/600x300.png?text=Slide+5" alt="スライド 5">
      </div>
    </div>

    <div class="caption" id="caption">スライド 1 / 5</div>

    <div class="dots" id="dots"></div>

    <div class="controls">
      <button class="btn" id="prev">← 前へ</button>
      <span class="counter" id="counter">1 / 5</span>
      <button class="btn" id="next">次へ →</button>
    </div>
  </div>

  <script>
    const slides = document.querySelectorAll('.slide');
    const dotsContainer = document.getElementById('dots');
    const counter = document.getElementById('counter');
    const caption = document.getElementById('caption');
    const btnPrev = document.getElementById('prev');
    const btnNext = document.getElementById('next');
    const total = slides.length;
    let current = 0;

    // ドットを生成
    slides.forEach((_, i) => {
      const dot = document.createElement('span');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.addEventListener('click', () => goTo(i));
      dotsContainer.appendChild(dot);
    });

    function goTo(index) {
      slides[current].classList.remove('active');
      dotsContainer.children[current].classList.remove('active');
      current = index;
      slides[current].classList.add('active');
      dotsContainer.children[current].classList.add('active');
      counter.textContent = (current + 1) + ' / ' + total;
      caption.textContent = 'スライド ' + (current + 1) + ' / ' + total;
      btnPrev.disabled = current === 0;
      btnNext.disabled = current === total - 1;
    }

    btnPrev.addEventListener('click', () => { if (current > 0) goTo(current - 1); });
    btnNext.addEventListener('click', () => { if (current < total - 1) goTo(current + 1); });

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft')  { if (current > 0) goTo(current - 1); }
      if (e.key === 'ArrowRight') { if (current < total - 1) goTo(current + 1); }
    });

    // 初期状態
    goTo(0);
  </script>

</body>
</html>
